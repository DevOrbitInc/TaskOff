<body class="flex min-h-screen bg-taskoff-bg text-taskoff-text">
  <!-- SIDEBAR -->
  <aside
    class="flex flex-col justify-between hidden w-64 p-5 border-r bg-taskoff-sidebar border-taskoff-border md:flex shrink-0"
  >
    <div>
      <div class="flex items-center gap-2.5 mb-8">
        <div
          class="flex items-center justify-center text-sm font-bold text-white rounded-lg w-7 h-7 bg-taskoff-primary"
        >
          ✓
        </div>
        <span class="text-xl font-bold tracking-tight text-taskoff-text"
          >TaskOff</span
        >
      </div>

      <!-- Navigation dynamique -->
      <nav class="space-y-1">
        <button
          id="nav-board"
          onclick="switchPage('board')"
          class="flex items-center w-full gap-3 px-3 py-2 text-sm font-medium transition rounded-lg"
        >
          <i data-lucide="layout-grid" class="w-4 h-4"></i> Board
        </button>
        <button
          id="nav-list"
          onclick="switchPage('list')"
          class="flex items-center w-full gap-3 px-3 py-2 text-sm font-medium transition rounded-lg text-taskoff-subtext hover:bg-slate-50"
        >
          <i data-lucide="list" class="w-4 h-4"></i> List view
        </button>
        <button
          id="nav-my-tasks"
          onclick="switchPage('my-tasks')"
          class="flex items-center w-full gap-3 px-3 py-2 text-sm font-medium transition rounded-lg text-taskoff-subtext hover:bg-slate-50"
        >
          <i data-lucide="check-square" class="w-4 h-4"></i> My tasks
        </button>
      </nav>
    </div>

    <div
      class="flex items-center justify-between pt-4 border-t border-taskoff-border"
    >
      <div class="flex items-center gap-3">
        <div
          class="flex items-center justify-center text-xs font-semibold bg-blue-100 rounded-full w-9 h-9 text-taskoff-primary"
        >
          DH
        </div>
        <div>
          <div class="text-sm font-semibold leading-tight text-taskoff-text">
            Doha H.
          </div>
          <div class="text-xs text-taskoff-subtext">Frontend</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- CONTENU PRINCIPAL -->
  <main class="flex flex-col flex-1 min-w-0">
    <!-- Header -->
    <header
      class="flex items-center justify-between h-16 px-8 bg-white border-b border-taskoff-border shrink-0"
    >
      <div class="flex items-center gap-3">
        <h1 id="pageTitle" class="text-xl font-bold text-taskoff-text">
          Board
        </h1>
        <span
          class="text-xs text-taskoff-subtext bg-slate-100 px-2.5 py-0.5 rounded-full font-medium"
          >TaskOff - MVP</span
        >
      </div>
      <button
        onclick="openModal('create')"
        class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-white transition rounded-lg shadow-sm bg-taskoff-primary hover:bg-blue-700"
      >
        <i data-lucide="plus" class="w-4 h-4"></i> New task
      </button>
    </header>

    <!-- PAGE 1: KANBAN BOARD -->
    <div id="page-board" class="flex-1 p-8 overflow-x-auto page-content">
      <div class="grid grid-cols-1 md:grid-cols-4 gap-6 min-w-[1000px]">
        <div class="flex flex-col gap-3">
          <div
            class="flex items-center justify-between mb-1 text-sm font-semibold text-taskoff-subtext"
          >
            <span class="flex items-center gap-2"
              ><span class="w-2 h-2 rounded-full bg-slate-400"></span> To
              do</span
            >
            <span
              id="count-todo"
              class="bg-slate-200 text-slate-700 text-xs px-2 py-0.5 rounded-full"
              >0</span
            >
          </div>
          <div id="col-todo" class="space-y-3 min-h-[500px]"></div>
        </div>

        <div class="flex flex-col gap-3">
          <div
            class="flex items-center justify-between mb-1 text-sm font-semibold text-taskoff-subtext"
          >
            <span class="flex items-center gap-2"
              ><span class="w-2 h-2 rounded-full bg-amber-500"></span> In
              progress</span
            >
            <span
              id="count-in-progress"
              class="bg-slate-200 text-slate-700 text-xs px-2 py-0.5 rounded-full"
              >0</span
            >
          </div>
          <div id="col-in-progress" class="space-y-3 min-h-[500px]"></div>
        </div>

        <div class="flex flex-col gap-3">
          <div
            class="flex items-center justify-between mb-1 text-sm font-semibold text-taskoff-subtext"
          >
            <span class="flex items-center gap-2"
              ><span class="w-2 h-2 bg-blue-500 rounded-full"></span> In
              review</span
            >
            <span
              id="count-in-review"
              class="bg-slate-200 text-slate-700 text-xs px-2 py-0.5 rounded-full"
              >0</span
            >
          </div>
          <div id="col-in-review" class="space-y-3 min-h-[500px]"></div>
        </div>

        <div class="flex flex-col gap-3">
          <div
            class="flex items-center justify-between mb-1 text-sm font-semibold text-taskoff-subtext"
          >
            <span class="flex items-center gap-2"
              ><span class="w-2 h-2 rounded-full bg-emerald-500"></span>
              Done</span
            >
            <span
              id="count-done"
              class="bg-slate-200 text-slate-700 text-xs px-2 py-0.5 rounded-full"
              >0</span
            >
          </div>
          <div id="col-done" class="space-y-3 min-h-[500px]"></div>
        </div>
      </div>
    </div>

    <!-- PAGE 2 & 3: LIST VIEW & MY TASKS -->
    <div id="page-list" class="flex-1 hidden p-8 page-content">
      <div
        class="overflow-hidden bg-white border shadow-sm rounded-xl border-taskoff-border"
      >
        <table class="w-full text-sm text-left">
          <thead
            class="text-xs uppercase border-b bg-slate-50 border-taskoff-border text-taskoff-subtext"
          >
            <tr>
              <th class="px-6 py-3 font-semibold">Task</th>
              <th class="px-6 py-3 font-semibold">Status</th>
              <th class="px-6 py-3 font-semibold">Tag</th>
              <th class="px-6 py-3 font-semibold">Assignee</th>
            </tr>
          </thead>
          <tbody
            id="listTableBody"
            class="divide-y divide-taskoff-border"
          ></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- MODALE CREATION / EDITION -->
  <div
    id="taskModal"
    class="fixed inset-0 z-50 flex items-center justify-center hidden bg-slate-900/40 backdrop-blur-sm"
  >
    <div
      class="relative w-full max-w-lg p-6 bg-white border shadow-2xl rounded-xl border-taskoff-border"
    >
      <div class="flex items-center justify-between mb-6">
        <h2 id="modalTitle" class="text-xl font-bold text-taskoff-text">
          New task
        </h2>
        <button
          onclick="closeModal()"
          class="text-taskoff-subtext hover:text-taskoff-text"
        >
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="taskForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
        <input type="hidden" id="taskId" />

        <div>
          <label
            class="block mb-1 text-xs font-semibold tracking-wider uppercase text-taskoff-subtext"
            >Title</label
          >
          <input
            type="text"
            id="taskTitleInput"
            required
            placeholder="e.g. Build create/edit task modal"
            class="w-full bg-slate-50 border border-taskoff-border rounded-lg px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20"
          />
        </div>

        <div>
          <label
            class="block mb-1 text-xs font-semibold tracking-wider uppercase text-taskoff-subtext"
            >Description</label
          >
          <textarea
            id="taskDescInput"
            rows="3"
            placeholder="Optional details..."
            class="w-full bg-slate-50 border border-taskoff-border rounded-lg px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 resize-none"
          ></textarea>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label
              class="block mb-1 text-xs font-semibold tracking-wider uppercase text-taskoff-subtext"
              >Status</label
            >
            <select
              id="taskStatusSelect"
              class="w-full px-3 py-2 text-sm border rounded-lg bg-slate-50 border-taskoff-border focus:outline-none"
            >
              <option value="todo">To do</option>
              <option value="in-progress">In progress</option>
              <option value="in-review">In review</option>
              <option value="done">Done</option>
            </select>
          </div>

          <div>
            <label
              class="block mb-1 text-xs font-semibold tracking-wider uppercase text-taskoff-subtext"
              >Assignee</label
            >
            <select
              id="taskAssigneeSelect"
              class="w-full px-3 py-2 text-sm border rounded-lg bg-slate-50 border-taskoff-border focus:outline-none"
            >
              <option value="Unassigned">Unassigned</option>
              <option value="Doha H.">Doha H.</option>
              <option value="Fati T.">Fati T.</option>
            </select>
          </div>
        </div>

        <div>
          <label
            class="block mb-1 text-xs font-semibold tracking-wider uppercase text-taskoff-subtext"
            >Tag</label
          >
          <input
            type="text"
            id="taskTagInput"
            placeholder="e.g. frontend, backend"
            class="w-full bg-slate-50 border border-taskoff-border rounded-lg px-3.5 py-2 text-sm focus:outline-none"
          />
        </div>

        <div
          class="flex items-center justify-between pt-4 mt-6 border-t border-taskoff-border"
        >
          <button
            type="button"
            id="deleteBtn"
            onclick="deleteTask()"
            class="flex items-center hidden gap-1 text-sm font-semibold text-taskoff-danger hover:text-red-700"
          >
            <i data-lucide="trash-2" class="w-4 h-4"></i> Delete task
          </button>

          <div class="flex gap-2 ml-auto">
            <button
              type="button"
              onclick="closeModal()"
              class="px-4 py-2 text-sm font-semibold rounded-lg text-taskoff-subtext hover:bg-slate-100"
            >
              Cancel
            </button>
            <button
              type="submit"
              id="saveBtn"
              class="px-4 py-2 text-sm font-semibold text-white transition rounded-lg bg-taskoff-primary hover:bg-blue-700"
            >
              Create task
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</body>
